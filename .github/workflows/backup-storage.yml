name: Backup do Supabase Storage (arquivos -> Azure Blob)

on:
  schedule:
    - cron: "0 4 * * *" # diário
  workflow_dispatch: {}

jobs:
  backup-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (Supabase Storage via S3-compatible API + Azure Blob)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [supabase]
          type = s3
          provider = Other
          endpoint = ${SUPABASE_S3_ENDPOINT}
          access_key_id = ${SUPABASE_S3_ACCESS_KEY_ID}
          secret_access_key = ${SUPABASE_SERVICE_ROLE_KEY}

          [azureblob]
          type = azureblob
          connection_string = ${AZURE_STORAGE_CONNECTION_STRING}
          EOF

      # rclone copy (nunca `sync`): um backup nunca deve replicar deleções do
      # Supabase Storage no mesmo instante — um arquivo apagado por engano (ou por
      # um bug) precisa continuar recuperável do backup até a política de retenção
      # expirar, não desaparecer da cópia no dia seguinte. A transição hot (30 dias)
      # -> cool -> archive -> expiração (1 ano) é feita por uma Lifecycle Management
      # Policy do Storage Account (Terraform/infra), não por este workflow.
      - name: Copiar Supabase Storage -> Azure Blob (sem replicar deleções)
        run: |
          rclone copy supabase: azureblob:storage-backups \
            --transfers 8 --checkers 16 --fast-list --stats 30s

      - name: Notificar falha
        if: failure()
        run: |
          curl -sf -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ Backup do Supabase Storage do Iustitia falhou — ver ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
